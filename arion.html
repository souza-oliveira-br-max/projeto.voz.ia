 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARION — Sistema Integrado de Percepção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #000;
            --bg2: #0a0a0a;
            --text: #00ff88;
            --text2: #00cc77;
            --border: #003322;
            --grad: linear-gradient(135deg, #00ff88 0%, #00cc77 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        .arion-header {
            position: fixed; top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000;
        }
        .arion-logo {
            display: flex; align-items: center; gap: 12px;
            font-weight: 700; letter-spacing: 2px;
        }
        .arion-logo .pulse {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--text); box-shadow: 0 0 15px var(--text);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .arion-status {
            display: flex; gap: 10px; align-items: center; font-size: 12px;
        }
        .status-badge {
            padding: 4px 10px; border-radius: 20px;
            background: rgba(0,255,136,0.05);
            border: 1px solid var(--border);
            font-size: 11px;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .status-badge.on { color: var(--text); border-color: var(--text); }
        .status-badge.off { color: rgba(0,255,136,0.2); }
        .status-badge.thinking {
            color: #ffc107; border-color: #ffc107;
            animation: thinking 1s infinite;
        }
        @keyframes thinking {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .arion-main {
            display: grid; grid-template-columns: 1fr 400px;
            gap: 15px; padding: 71px 15px 15px; height: 100vh;
        }
        .arion-camera-area {
            position: relative; background: #000;
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
        }
        .arion-camera { width: 100%; height: 100%; object-fit: cover; display: block; }
        .arion-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none;
        }
        .camera-info {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); padding: 10px 15px;
            border-radius: 10px; border: 1px solid var(--border); font-size: 12px;
        }
        .camera-info .linha {
            display: flex; justify-content: space-between; gap: 15px; margin-bottom: 4px;
        }
        .camera-info .label { color: rgba(0,255,136,0.4); }
        .camera-info .valor { color: var(--text); font-weight: 600; }

        .mic-meter {
            position: absolute;
            bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .mic-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(0,255,136,0.5);
        }
        .mic-bar-bg {
            width: 150px;
            height: 8px;
            background: rgba(0,255,136,0.05);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .mic-bar {
            height: 100%;
            width: 0%;
            background: var(--grad);
            border-radius: 4px;
            transition: width 0.05s ease-out;
            box-shadow: 0 0 10px rgba(0,255,136,0.5);
        }

        .arion-panel {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
        }
        .panel-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border);
            font-size: 13px; font-weight: 700; letter-spacing: 1px;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        }
        .conversa {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .mensagem {
            padding: 10px 14px; border-radius: 12px;
            font-size: 13px; line-height: 1.5;
            max-width: 90%; word-wrap: break-word;
        }
        .mensagem.user {
            background: rgba(0,255,136,0.08);
            border: 1px solid var(--border);
            align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .mensagem.arion {
            background: rgba(0,255,136,0.03);
            border: 1px solid var(--border);
            align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .mensagem .remetente {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 1px; font-weight: 700;
            margin-bottom: 4px; opacity: 0.7;
        }
        .mensagem.user .remetente { color: #fff; }
        .mensagem.arion .remetente { color: var(--text); }
        .panel-input {
            padding: 12px 15px; border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: center;
        }
        .btn-voz {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--grad); border: none; color: #000;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; flex-shrink: 0;
        }
        .btn-voz:hover { transform: scale(1.05); }
        .btn-voz.gravando { animation: gravando 1.5s infinite; }
        @keyframes gravando {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.7); }
            50% { box-shadow: 0 0 0 15px rgba(0,255,136,0); }
        }
        .campo-texto {
            flex: 1; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); color: var(--text);
            padding: 12px 16px; border-radius: 10px;
            font-size: 14px; outline: none;
        }
        .campo-texto:focus { border-color: var(--text); }
        .campo-texto::placeholder { color: rgba(0,255,136,0.2); }
        .arion-controles {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 10px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 8px 12px; z-index: 1000;
        }
        .ctrl-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: transparent; border: 1px solid var(--border);
            color: rgba(0,255,136,0.4); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; font-size: 16px;
        }
        .ctrl-btn:hover { color: var(--text); border-color: var(--text); }
        .ctrl-btn.on { color: #000; background: var(--text); border-color: var(--text); }
        .modal-arion {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-arion.open { display: flex; }
        .modal-arion-content {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 16px; padding: 30px; max-width: 500px; width: 100%;
        }
        .modal-arion-content h3 { color: var(--text); margin-bottom: 20px; font-size: 18px; }
        .config-item { margin-bottom: 20px; }
        .config-item label {
            display: block; color: rgba(0,255,136,0.5);
            font-size: 12px; text-transform: uppercase;
            margin-bottom: 8px; letter-spacing: 1px;
        }
        .config-item select, .config-item input {
            width: 100%; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); color: var(--text);
            padding: 10px 14px; border-radius: 10px; font-size: 14px;
        }
        .btn-fechar {
            background: var(--grad); color: #000; border: none;
            padding: 10px 24px; border-radius: 10px;
            font-weight: 700; cursor: pointer; width: 100%;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.3); border-radius: 4px; }
        @media (max-width: 900px) {
            .arion-main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header class="arion-header">
        <div class="arion-logo">
            <div class="pulse"></div>
            <span>ARION</span>
        </div>
        <div class="arion-status">
            <span class="status-badge off" id="statusOlho"><i class="fas fa-eye"></i> OLHO</span>
            <span class="status-badge off" id="statusOuvido"><i class="fas fa-ear-listen"></i> OUVIDO</span>
            <span class="status-badge off" id="statusVoz"><i class="fas fa-volume-up"></i> VOZ</span>
        </div>
    </header>

    <main class="arion-main">
        <div class="arion-camera-area">
            <video class="arion-camera" id="arionVideo" autoplay playsinline muted></video>
            <canvas class="arion-overlay" id="arionOverlay"></canvas>
            <div class="camera-info">
                <div class="linha"><span class="label">FPS:</span><span class="valor" id="infoFps">0</span></div>
                <div class="linha"><span class="label">Rostos:</span><span class="valor" id="infoFaces">0</span></div>
                <div class="linha"><span class="label">Modo:</span><span class="valor" id="infoModo">aguardando</span></div>
            </div>
            <div class="mic-meter">
                <div class="mic-label">
                    <i class="fas fa-microphone"></i>
                    <span>MIC</span>
                </div>
                <div class="mic-bar-bg">
                    <div class="mic-bar" id="micBar"></div>
                </div>
            </div>
        </div>

        <div class="arion-panel">
            <div class="panel-header">
                <i class="fas fa-comments"></i>
                <span>Conversa com Arion</span>
            </div>
            <div class="conversa" id="conversa"></div>
            <div class="panel-input">
                <button class="btn-voz" id="btnVoz" title="Falar com Arion">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" class="campo-texto" id="campoTexto" placeholder="Digite ou fale com o Arion...">
            </div>
        </div>
    </main>

    <div class="arion-controles">
        <button class="ctrl-btn" id="btnIniciar" title="Iniciar Arion"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="btnCamera" title="Ligar/Desligar câmera"><i class="fas fa-video"></i></button>
        <button class="ctrl-btn" id="btnMicrofone" title="Ligar/Desligar microfone"><i class="fas fa-microphone"></i></button>
        <button class="ctrl-btn" id="btnLimparMemoria" title="Limpar memória"><i class="fas fa-trash"></i></button>
        <button class="ctrl-btn" id="btnConfig" title="Configurações"><i class="fas fa-cog"></i></button>
    </div>

    <div class="modal-arion" id="modalConfig">
        <div class="modal-arion-content">
            <h3><i class="fas fa-cog me-2"></i>Configurações do Arion</h3>
            <div class="config-item">
                <label>Voz</label>
                <select id="cfgVoz"><option value="">Carregando vozes...</option></select>
            </div>
            <div class="config-item">
                <label>Velocidade da fala</label>
                <input type="range" id="cfgVelocidade" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="config-item">
                <label>Tom da fala</label>
                <input type="range" id="cfgTom" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="config-item">
                <label>Palavra de ativação</label>
                <input type="text" id="cfgWakeWord" value="arion" placeholder="ex: arion">
            </div>
            <button class="btn-fechar" onclick="fecharConfig()">FECHAR</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <script src="vad.js"></script>
    <script src="memoria.js"></script>
    <script src="transcritor.js"></script>

    <script>
    // ============================================================
    // CONFIG — Supabase Edge Function (Gemini)
    // ============================================================
    const SUPABASE_PROJECT = 'kqccjteefsjwopmwkjay';
    const ARION_CHAT_URL = `https://${SUPABASE_PROJECT}.supabase.co/functions/v1/arion-chat`;

    const ARION = {
        ativo: false,
        cameraLigada: false,
        micLigado: false,
        vozLigada: true,
        pensando: false,
        faces: [],
        objetos: [],
        ultimoFps: 0,
        frameCount: 0,
        ultimoFrameTime: performance.now(),
        wakeWord: 'arion',
        config: {
            voz: 'Microsoft Daniel - Portuguese (Brazil)',
            velocidade: 1.0,
            tom: 1.0
        }
    };

    // ---------- MÓDULO 1 — OUVIDO (legado) ----------
    class Ouvido {
        constructor() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { console.warn('⚠️ SpeechRecognition não suportado'); return; }
            this.rec = new SR();
            this.rec.lang = 'pt-BR';
            this.rec.continuous = true;
            this.rec.interimResults = true;
            this.rec.maxAlternatives = 1;
            this.ouvindo = false;
            this.callbackFinal = null;
            this.callbackInterim = null;
            this.rec.onresult = (e) => {
                let final = '';
                let interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const txt = e.results[i][0].transcript;
                    if (e.results[i].isFinal) final += txt;
                    else interim += txt;
                }
                if (final && this.callbackFinal) this.callbackFinal(final.trim());
                if (interim && this.callbackInterim) this.callbackInterim(interim.trim());
            };
            this.rec.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    ArionUI.adicionarMensagem('arion', 'Preciso de permissão para usar o microfone.');
                }
            };
            this.rec.onend = () => {
                if (this.ouvindo) { try { this.rec.start(); } catch(e) {} }
            };
        }
        iniciar(callbackFinal, callbackInterim) {
            if (!this.rec) return false;
            this.callbackFinal = callbackFinal;
            this.callbackInterim = callbackInterim || null;
            this.ouvindo = true;
            try { this.rec.start(); } catch(e) {}
            return true;
        }
        parar() {
            this.ouvindo = false;
            if (this.rec) { try { this.rec.stop(); } catch(e) {} }
        }
    }

    // ---------- MÓDULO 2 — VOZ ----------
    class Voz {
        constructor() {
            this.synth = window.speechSynthesis;
            this.vozes = [];
            this.carregarVozes();
            if (this.synth.onvoiceschanged !== undefined) {
                this.synth.onvoiceschanged = () => this.carregarVozes();
            }
        }
        carregarVozes() {
            this.vozes = this.synth.getVoices();
            const select = document.getElementById('cfgVoz');
            if (!select) return;
            const ptVozes = this.vozes.filter(v => v.lang.startsWith('pt'));
            const outras = this.vozes.filter(v => !v.lang.startsWith('pt'));
            select.innerHTML = '';
            if (ptVozes.length > 0) {
                const group = document.createElement('optgroup');
                group.label = 'Português';
                ptVozes.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})`;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            }
            if (outras.length > 0) {
                const group = document.createElement('optgroup');
                group.label = 'Outras';
                outras.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})`;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            }
            if (ptVozes.length > 0) select.value = ARION.config.voz || ptVozes[0].name;
        }
        falar(texto, opcoes = {}) {
            if (!ARION.vozLigada || !this.synth) return;
            this.synth.cancel();
            const utt = new SpeechSynthesisUtterance(texto);
            const vozSelecionada = ARION.config.voz || document.getElementById('cfgVoz')?.value;
            const voz = this.vozes.find(v => v.name === vozSelecionada);
            if (voz) utt.voice = voz;
            utt.lang = voz?.lang || 'pt-BR';
            utt.rate = opcoes.rate || ARION.config.velocidade;
            utt.pitch = opcoes.pitch || ARION.config.tom;
            utt.volume = 1;
            this.synth.speak(utt);
        }
        parar() { if (this.synth) this.synth.cancel(); }
    }

    // ---------- MÓDULO 3 — OLHO ----------
    class Olho {
        constructor() {
            this.video = document.getElementById('arionVideo');
            this.overlay = document.getElementById('arionOverlay');
            this.ctx = this.overlay.getContext('2d');
            this.stream = null; this.landmarker = null; this.detector = null;
            this.ligado = false;
            this.ultimaDeteccaoObjetos = 0;
            this.ultimaDeteccaoFaces = 0;
        }
        async iniciar() {
            try {
                this.stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }, facingMode: 'user' },
                    audio: false
                });
                this.video.srcObject = this.stream;
                await this.video.play();
                this.ligado = true;
            } catch(e) { console.error('❌ Erro câmera:', e); return false; }
            try {
                if (typeof FilesetResolver === 'undefined') {
                    console.warn('⚠️ MediaPipe não carregou');
                } else {
                    const vision = await FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
                    );
                    this.landmarker = await FaceLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO", numFaces: 5
                    });
                }
            } catch(e) { console.warn('⚠️ MediaPipe falhou:', e); }
            try {
                if (typeof cocoSsd !== 'undefined') {
                    this.detector = await cocoSsd.load({ base: 'mobilenet_v2' });
                }
            } catch(e) { console.warn('⚠️ COCO-SSD falhou:', e); }
            this.loopDeteccao();
            ArionUI.atualizarStatus('olho', true);
            return true;
        }
        async loopDeteccao() {
            if (!this.ligado) return;
            const agora = performance.now();
            if (this.landmarker && agora - this.ultimaDeteccaoFaces > 66) {
                try {
                    const res = this.landmarker.detectForVideo(this.video, agora);
                    ARION.faces = (res.faceLandmarks || []).map((lm, idx) => ({
                        id: idx, landmarks: lm, box: this._boundingBox(lm)
                    }));
                    document.getElementById('infoFaces').textContent = ARION.faces.length;
                } catch(e) {}
                this.ultimaDeteccaoFaces = agora;
            }
            if (this.detector && agora - this.ultimaDeteccaoObjetos > 500) {
                try {
                    const preds = await this.detector.detect(this.video);
                    ARION.objetos = preds.filter(p => p.score > 0.6);
                } catch(e) {}
                this.ultimaDeteccaoObjetos = agora;
            }
            this._desenhar();
            ARION.frameCount++;
            const delta = (agora - ARION.ultimoFrameTime) / 1000;
            if (delta >= 1) {
                ARION.ultimoFps = Math.round(ARION.frameCount / delta);
                ARION.frameCount = 0; ARION.ultimoFrameTime = agora;
                document.getElementById('infoFps').textContent = ARION.ultimoFps;
            }
            requestAnimationFrame(() => this.loopDeteccao());
        }
        _boundingBox(landmarks) {
            let minX = 1, minY = 1, maxX = 0, maxY = 0;
            for (const p of landmarks) {
                if (p.x < minX) minX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.x > maxX) maxX = p.x;
                if (p.y > maxY) maxY = p.y;
            }
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }
        _desenhar() {
            const w = this.overlay.width = this.video.videoWidth || 1280;
            const h = this.overlay.height = this.video.videoHeight || 720;
            this.ctx.clearRect(0, 0, w, h);
            this.ctx.lineWidth = 3; this.ctx.strokeStyle = '#00ff88';
            this.ctx.shadowColor = '#00ff88'; this.ctx.shadowBlur = 10;
            ARION.faces.forEach(f => {
                const x = f.box.x * w, y = f.box.y * h;
                const bw = f.box.w * w, bh = f.box.h * h;
                this.ctx.strokeRect(x, y, bw, bh);
                this.ctx.shadowBlur = 0;
                this.ctx.fillStyle = '#00ff88';
                this.ctx.fillRect(x, y - 22, 100, 20);
                this.ctx.fillStyle = '#000';
                this.ctx.font = 'bold 12px monospace';
                this.ctx.fillText('ROSTO ' + (f.id + 1), x + 6, y - 8);
                this.ctx.shadowBlur = 10;
            });
            this.ctx.lineWidth = 2; this.ctx.strokeStyle = '#ffc107';
            this.ctx.shadowColor = '#ffc107';
            ARION.objetos.forEach(o => {
                const [x, y, bw, bh] = o.bbox;
                this.ctx.strokeRect(x, y, bw, bh);
                this.ctx.shadowBlur = 0;
                this.ctx.fillStyle = '#ffc107';
                this.ctx.fillRect(x, y - 20, 130, 18);
                this.ctx.fillStyle = '#000';
                this.ctx.font = 'bold 11px monospace';
                this.ctx.fillText(`${o.class} ${Math.round(o.score * 100)}%`, x + 6, y - 7);
                this.ctx.shadowBlur = 10;
            });
            this.ctx.shadowBlur = 0;
        }
        parar() {
            this.ligado = false;
            if (this.stream) {
                this.stream.getTracks().forEach(t => t.stop());
                this.stream = null;
            }
            this.ctx.clearRect(0, 0, this.overlay.width, this.overlay.height);
            ArionUI.atualizarStatus('olho', false);
        }
        descreverCena() {
            const partes = [];
            if (ARION.faces.length > 0) {
                partes.push(`Vejo ${ARION.faces.length} ${ARION.faces.length === 1 ? 'pessoa' : 'pessoas'} à minha frente`);
            } else {
                partes.push('Não vejo ninguém');
            }
            if (ARION.objetos.length > 0) {
                const contagem = {};
                ARION.objetos.forEach(o => {
                    const nome = traduzirClasse(o.class);
                    contagem[nome] = (contagem[nome] || 0) + 1;
                });
                const lista = Object.entries(contagem)
                    .map(([nome, qtd]) => qtd > 1 ? `${qtd} ${nome}s` : `1 ${nome}`)
                    .join(', ');
                partes.push(`Reconheço: ${lista}`);
            }
            return partes.join('. ') + '.';
        }
    }

    // ---------- MÓDULO 4 — NÚCLEO ----------
    class ArionCore {
        constructor() {
            this.ouvido = null; this.voz = null; this.olho = null;
            this.vad = null; this.memoria = null; this.micMeter = null;
            this.transcritor = null;
            this.ativo = false;
        }

        async iniciar() {
            this.memoria = new Memoria();
            const configSalva = this.memoria.getConfig();
            ARION.config = { ...ARION.config, ...configSalva };
            ARION.wakeWord = configSalva.wakeWord || 'arion';

            this.voz = new Voz();
            this.ouvido = new Ouvido();
            this.olho = new Olho();
            ArionUI.atualizarStatus('voz', true);

            const okCamera = await this.olho.iniciar();
            if (!okCamera) {
                ArionUI.adicionarMensagem('arion', 'Sem câmera não consigo ver. Mas posso te ouvir e falar.');
            }

            if (this.ouvido && this.ouvido.rec) {
                this.ouvido.iniciar(
                    texto => this.processarFala(texto),
                    texto => console.log('🎤 interim:', texto)
                );
                ArionUI.atualizarStatus('ouvido', true);
            }

            // Transcritor (Gemini) — a forma principal
            try {
                this.transcritor = new Transcritor({ debug: true });
                await this.transcritor.iniciar(texto => {
                    if (texto && texto.length > 1) {
                        console.log('📝 Transcrito:', texto);
                        this.processarFala(texto);
                    }
                });
            } catch(e) { console.warn('⚠️ Transcritor não iniciou:', e); }

            // VAD — full-duplex + dispara a gravação
            try {
                this.vad = new VAD({ debug: true });
                await this.vad.iniciar(
                    () => {
                        if (speechSynthesis.speaking) {
                            speechSynthesis.cancel();
                            console.log('🤫 Arion interrompido pelo usuário');
                        }
                        if (this.transcritor) this.transcritor.comecarGravacao();
                    },
                    () => {
                        if (this.transcritor) this.transcritor.pararGravacao();
                    }
                );
            } catch(e) { console.warn('⚠️ VAD não iniciou:', e); }

            try {
                this.micMeter = new MicMeter();
                await this.micMeter.iniciar();
            } catch(e) { console.warn('⚠️ MicMeter não iniciou:', e); }

            this.ativo = true;
            ARION.ativo = true;

            setTimeout(() => {
                const saudacao = this.memoria.gerarSaudacao();
                this.voz.falar(saudacao);
                ArionUI.adicionarMensagem('arion', saudacao);
                this.memoria.adicionarMensagem('arion', saudacao);
            }, 500);
        }

        async pensar(mensagem) {
            if (ARION.pensando) return;
            ARION.pensando = true;
            const statusVoz = document.getElementById('statusVoz');
            statusVoz.className = 'status-badge thinking';
            statusVoz.innerHTML = '<i class="fas fa-brain"></i> PENSANDO';
            try {
                const historico = this.memoria.getHistorico(10);
                const identidade = this.memoria.getIdentidade();
                const resp = await fetch(ARION_CHAT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem, historico, identidade })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const resposta = data?.resposta || 'Não consegui pensar agora.';
                this.responder(resposta);
            } catch (e) {
                console.error('❌ Gemini erro:', e);
                this.responder('Tive um problema pra pensar agora. Tenta de novo?');
            } finally {
                ARION.pensando = false;
                ArionUI.atualizarStatus('voz', ARION.vozLigada);
            }
        }

        processarFala(texto) {
            if (!texto || texto.length < 2) return;
            ArionUI.adicionarMensagem('user', texto);
            this.memoria.adicionarMensagem('user', texto);

            const lower = texto.toLowerCase();
            const semWake = lower.replace(new RegExp(`^${ARION.wakeWord}[,\\s]*`), '');

            if (/o que (você )?v[êe]|descrev|olha (pra|para)|o que tem/i.test(semWake)) {
                return this.responder(this.olho.descreverCena());
            }
            if (/quantas pessoas|tem algu[ée]m|quem (est[áa]|t[áa])/i.test(semWake)) {
                const n = ARION.faces.length;
                if (n === 0) return this.responder('Não vejo ninguém no momento.');
                if (n === 1) return this.responder('Vejo uma pessoa.');
                return this.responder(`Vejo ${n} pessoas.`);
            }
            if (/liga(r)? (a )?c[âa]mera/i.test(semWake)) {
                if (!this.olho.ligado) { this.olho.iniciar(); return this.responder('Câmera ligada.'); }
                return this.responder('A câmera já está ligada.');
            }
            if (/desliga(r)? (a )?c[âa]mera/i.test(semWake)) {
                if (this.olho.ligado) { this.olho.parar(); return this.responder('Câmera desligada.'); }
                return this.responder('A câmera já está desligada.');
            }
            if (/sil[êe]ncio|cala(r)? (a )?boca|para(r)? de falar/i.test(semWake)) {
                ARION.vozLigada = false;
                ArionUI.atualizarStatus('voz', false);
                return;
            }
            if (/volta(r)? a falar|fala(r)? de novo/i.test(semWake)) {
                ARION.vozLigada = true;
                ArionUI.atualizarStatus('voz', true);
                return this.responder('Voltei a falar.');
            }
            if (/quem (é )?voc[êe]/i.test(semWake)) {
                return this.responder('Eu sou Arion. Fui criado para te ver, te ouvir e te ajudar.');
            }

            this.pensar(texto);
        }

        processarTexto(texto) {
            this.processarFala(texto);
        }

        responder(texto) {
            ArionUI.adicionarMensagem('arion', texto);
            this.memoria.adicionarMensagem('arion', texto);
            if (ARION.vozLigada && this.voz) this.voz.falar(texto);
        }
    }

    // ---------- MÓDULO 5 — UI ----------
    const ArionUI = {
        adicionarMensagem(remetente, texto) {
            const conversa = document.getElementById('conversa');
            const div = document.createElement('div');
            div.className = 'mensagem ' + remetente;
            div.innerHTML = `
                <div class="remetente">${remetente === 'user' ? 'Você' : 'Arion'}</div>
                ${texto}
            `;
            conversa.appendChild(div);
            conversa.scrollTop = conversa.scrollHeight;
        },
        atualizarStatus(tipo, ligado) {
            const el = document.getElementById('status' + tipo.charAt(0).toUpperCase() + tipo.slice(1));
            if (!el) return;
            el.className = 'status-badge ' + (ligado ? 'on' : 'off');
            if (tipo === 'voz') el.innerHTML = '<i class="fas fa-volume-up"></i> VOZ';
            if (tipo === 'ouvido') el.innerHTML = '<i class="fas fa-ear-listen"></i> OUVIDO';
            if (tipo === 'olho') el.innerHTML = '<i class="fas fa-eye"></i> OLHO';
        }
    };

    // ---------- MÓDULO 6 — MEDIDOR DE SINAL DO MICROFONE ----------
    class MicMeter {
        constructor() {
            this.audioContext = null;
            this.analyser = null;
            this.stream = null;
            this.rodando = false;
            this.barra = document.getElementById('micBar');
            this.picoSuavizado = 0;
        }
        async iniciar() {
            try {
                this.stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = this.audioContext.createMediaStreamSource(this.stream);
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 512;
                source.connect(this.analyser);
                this.rodando = true;
                this._loop();
                console.log('🎚️ MicMeter iniciado');
                return true;
            } catch(e) {
                console.error('❌ MicMeter erro:', e);
                return false;
            }
        }
        _loop() {
            if (!this.rodando) return;
            const buffer = new Uint8Array(this.analyser.fftSize);
            this.analyser.getByteTimeDomainData(buffer);
            let soma = 0;
            for (let i = 0; i < buffer.length; i++) {
                const v = (buffer[i] - 128) / 128;
                soma += v * v;
            }
            const rms = Math.sqrt(soma / buffer.length);
            const nivel = Math.min(100, rms * 300);
            if (nivel > this.picoSuavizado) {
                this.picoSuavizado = nivel;
            } else {
                this.picoSuavizado = this.picoSuavizado * 0.85 + nivel * 0.15;
            }
            if (this.barra) {
                this.barra.style.width = this.picoSuavizado + '%';
            }
            requestAnimationFrame(() => this._loop());
        }
        parar() {
            this.rodando = false;
            if (this.stream) {
                this.stream.getTracks().forEach(t => t.stop());
                this.stream = null;
            }
            if (this.audioContext) {
                this.audioContext.close();
                this.audioContext = null;
            }
            if (this.barra) this.barra.style.width = '0%';
            console.log('🎚️ MicMeter parado');
        }
    }

    function traduzirClasse(classe) {
        const map = {
            'person': 'pessoa', 'car': 'carro', 'motorcycle': 'moto', 'bus': 'ônibus',
            'truck': 'caminhão', 'bottle': 'garrafa', 'cup': 'copo', 'chair': 'cadeira',
            'couch': 'sofá', 'tv': 'TV', 'laptop': 'notebook', 'cell phone': 'celular',
            'book': 'livro', 'clock': 'relógio', 'keyboard': 'teclado', 'mouse': 'mouse',
            'dog': 'cachorro', 'cat': 'gato', 'bird': 'pássaro'
        };
        return map[classe] || classe;
    }

    let arion = null;

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnIniciar').addEventListener('click', async (e) => {
            if (arion && arion.ativo) return arion.responder('Já estou acordado.');
            e.currentTarget.classList.add('on');
            arion = new ArionCore();
            await arion.iniciar();
        });

        document.getElementById('btnCamera').addEventListener('click', (e) => {
            if (!arion || !arion.olho) return;
            if (arion.olho.ligado) {
                arion.olho.parar();
                e.currentTarget.classList.remove('on');
            } else {
                arion.olho.iniciar();
                e.currentTarget.classList.add('on');
            }
        });

        document.getElementById('btnMicrofone').addEventListener('click', (e) => {
            if (!arion) return;
            const ligado = e.currentTarget.classList.contains('on');
            if (ligado) {
                if (arion.ouvido) arion.ouvido.parar();
                if (arion.vad) arion.vad.parar();
                if (arion.micMeter) arion.micMeter.parar();
                if (arion.transcritor) arion.transcritor.parar();
                e.currentTarget.classList.remove('on');
                ArionUI.atualizarStatus('ouvido', false);
            } else {
                if (arion.ouvido) arion.ouvido.iniciar(
                    texto => arion.processarFala(texto),
                    texto => console.log('🎤 interim:', texto)
                );
                if (arion.transcritor) {
                    arion.transcritor.iniciar(texto => {
                        if (texto && texto.length > 1) arion.processarFala(texto);
                    });
                }
                if (arion.vad) {
                    arion.vad.iniciar(
                        () => {
                            if (speechSynthesis.speaking) speechSynthesis.cancel();
                            if (arion.transcritor) arion.transcritor.comecarGravacao();
                        },
                        () => {
                            if (arion.transcritor) arion.transcritor.pararGravacao();
                        }
                    );
                }
                if (arion.micMeter) arion.micMeter.iniciar();
                e.currentTarget.classList.add('on');
                ArionUI.atualizarStatus('ouvido', true);
            }
        });

        document.getElementById('btnLimparMemoria').addEventListener('click', () => {
            if (!arion || !arion.memoria) return;
            if (confirm('Apagar toda a memória do Arion?')) {
                arion.memoria.limparTudo();
                ArionUI.adicionarMensagem('arion', 'Memória apagada. Quem é você?');
            }
        });

        document.getElementById('btnConfig').addEventListener('click', abrirConfig);

        const btnVoz = document.getElementById('btnVoz');
        btnVoz.addEventListener('click', () => {
            if (!arion) return;
            btnVoz.classList.add('gravando');
            setTimeout(() => btnVoz.classList.remove('gravando'), 2000);
        });

        document.getElementById('campoTexto').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                if (!arion) { ArionUI.adicionarMensagem('arion', 'Clique em PLAY primeiro.'); return; }
                arion.processarTexto(e.target.value.trim());
                e.target.value = '';
            }
        });
    });

    function abrirConfig() {
        document.getElementById('modalConfig').classList.add('open');
        if (arion && arion.voz) arion.voz.carregarVozes();
        const cfg = arion?.memoria?.getConfig() || ARION.config;
        document.getElementById('cfgVelocidade').value = cfg.velocidade || 1;
        document.getElementById('cfgTom').value = cfg.tom || 1;
        document.getElementById('cfgWakeWord').value = cfg.wakeWord || 'arion';
    }

    function fecharConfig() {
        document.getElementById('modalConfig').classList.remove('open');
        ARION.config.voz = document.getElementById('cfgVoz').value;
        ARION.config.velocidade = parseFloat(document.getElementById('cfgVelocidade').value);
        ARION.config.tom = parseFloat(document.getElementById('cfgTom').value);
        ARION.wakeWord = document.getElementById('cfgWakeWord').value.toLowerCase() || 'arion';
        if (arion && arion.memoria) {
            arion.memoria.setConfig({
                voz: ARION.config.voz,
                velocidade: ARION.config.velocidade,
                tom: ARION.config.tom,
                wakeWord: ARION.wakeWord,
                vozLigada: ARION.vozLigada
            });
        }
    }

    window.fecharConfig = fecharConfig;
    window.abrirConfig = abrirConfig;
    </script>
